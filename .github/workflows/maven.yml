# This workflow builds and verifies a Java Maven project.
# It runs unit tests (via maven-surefire-plugin) and integration tests
# (via maven-failsafe-plugin). Integration tests use TestContainers to spin
# up an Elasticsearch instance; Docker is pre-installed on ubuntu-latest runners.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    name: Build and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and verify
      # Runs unit tests via maven-surefire-plugin and integration tests via
      # maven-failsafe-plugin. Integration tests use TestContainers to start
      # an Elasticsearch container on-demand; no separate service setup is needed.
      run: mvn -B clean verify --file pom.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/site/jacoco/
